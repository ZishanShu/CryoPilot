# Baseline: fixed workflow, modelangelo only, no LLM supervision.
# Used by T2 model-building success stop-A: map + sequence -> modelangelo.
protocol_name: fixed_workflow_modelangelo
protocol_kind: fixed_workflow
allowed_backends:
  - modelangelo
routing_mode: fixed
llm_supervision_enabled: false
fallback_policy: none
stop_points: []
success_criteria:
  require_non_empty_output: true
recovery_policy:
  retry_on_transient_error: false
notes: Fixed ModelAngelo baseline for sequence-guided map-to-model. No rerouting, no LLM.
