# ModelAngelo CLI (see upstream README: model_angelo build -v MAP -pf FASTA -o OUT)
model_angelo:
  # null means resolve via MODELANGELO_EXECUTABLE, then PATH.
  executable: null
  # Expanded by Python; override with MODELANGELO_TORCH_HOME or MODELANGELO_WEIGHTS_DIR.
  torch_home: "${MODELANGELO_TORCH_HOME:-${CRYOAGENT_ROOT}/model-angelo/model_angelo_weights}"
  weights_relpath: "hub/checkpoints/model_angelo_v1.0"
  subcommand_with_seq:
    - build
  flags:
    map: "-v"
    protein_fasta: "-pf"
    output: "-o"
  # Relative to project_root/.cryoem_agent/
  output_runs_subdir: modelangelo_runs
